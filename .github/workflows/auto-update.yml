name: N8N Auto Update & Deploy

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  update-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Clean package.json
        run: |
          LATEST_VERSION=$(npm view n8n version)
          cat << EOF > package.json
          {
            "name": "scalingo-n8n",
            "version": "1.0.0",
            "scripts": {
              "start": "n8n start"
            },
            "dependencies": {
              "n8n": "$LATEST_VERSION"
            },
            "engines": {
              "node": "20.x"
            }
          }
          EOF

      - name: Deploy to Scalingo with Custom Build Hook
        env:
          SSH_KEY: ${{ secrets.SCALINGO_SSH_KEY }}
          SCALINGO_URL: ${{ secrets.SCALINGO_GIT_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add package.json Procfile .slugignore bin/ 2>/dev/null || git add package.json Procfile .slugignore
          git commit -m "Auto-deploy: n8n updated" || echo "No changes to commit"
          
          git remote add scalingo $SCALINGO_URL || git remote set-url scalingo $SCALINGO_URL
          git push scalingo main:master -f
