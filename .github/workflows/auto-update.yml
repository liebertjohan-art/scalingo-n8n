name: N8N Auto Update & Deploy

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  update-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Clean App Manifest
        run: |
          LATEST_VERSION=$(npm view n8n version)
          cat << EOF > package.json
          {
            "name": "scalingo-n8n",
            "version": "1.0.0",
            "scripts": {
              "start": "./start.sh"
            },
            "dependencies": {
              "n8n": "$LATEST_VERSION"
            },
            "engines": {
              "node": ">=20.x"
            }
          }
          EOF

      - name: Commit manifest changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json Procfile start.sh .slugignore
          git commit -m "Auto-update: Bump n8n to latest" || echo "No changes"
          git push origin main || echo "Already synced"

      - name: Deploy to Scalingo
        env:
          SSH_KEY: ${{ secrets.SCALINGO_SSH_KEY }}
          SCALINGO_URL: ${{ secrets.SCALINGO_GIT_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

          git remote add scalingo $SCALINGO_URL || git remote set-url scalingo $SCALINGO_URL
          git push scalingo main:master -f
